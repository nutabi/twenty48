[package]
name = "twenty48"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
authors = ["Nguyen Thai Binh <ntb@nutabi.me>"]
description = "A dependency-free 2048 engine for a 4x4 grid, driven by a line-oriented command protocol"
repository = "https://github.com/nutabi/twenty48"
readme = "README.md"
license = "MIT"
keywords = ["2048", "game", "engine", "puzzle"]
categories = ["games", "game-development", "command-line-utilities"]
# Repository scaffolding, of no use to anyone consuming the crate: agent
# instructions, the CI and release workflows, and git's own ignore file. What
# stays is what a consumer or a downstream packager can use — the sources, the
# tests they build and run from the tarball, the protocol reference and the
# licence.
exclude = ["AGENTS.md", ".github/", ".gitignore"]

[dependencies]

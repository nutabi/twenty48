name: ci

on:
  push:
    branches: [main]
  pull_request:

# A superseded run tells us nothing; cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# The crate has no dependencies, so a build is seconds and a cache would cost
# more than it saves. That also keeps this file free of third-party actions.
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - run: cargo test --locked --all-targets
      # --all-targets skips doctests, so they need their own run.
      - run: cargo test --locked --doc

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --no-self-update
      # This is what docs.rs will build; a broken link should fail here first.
      - run: cargo doc --locked --no-deps

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Builds against the exact version Cargo.toml claims to support, rather
      # than trusting clippy's lint alone.
      - run: rustup toolchain install 1.85.0 --profile minimal --no-self-update
      - run: cargo +1.85.0 check --locked --all-targets

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --no-self-update
      # Catches a broken manifest or a stale exclude before release day.
      - run: cargo publish --locked --dry-run
      # An allowlist rather than a list of exclusions, so a file that starts
      # shipping has to be admitted deliberately. New sources and tests need no
      # change here; a new top-level file does, which is the point.
      - name: Only the crate's own files ship
        run: |
          listing=$(cargo package --locked --list)

          # `--list` prints nothing when it fails, and an empty listing would
          # satisfy the check below for the wrong reason.
          if [ -z "$listing" ]; then
            echo "cargo package --list printed nothing" >&2
            exit 1
          fi

          allowed='^(\.cargo_vcs_info\.json|Cargo\.toml|Cargo\.toml\.orig|Cargo\.lock|LICENSE|README\.md|PROTOCOL\.md|src/|tests/)'
          if unexpected=$(echo "$listing" | grep -vE "$allowed"); then
            echo "these are in the package but should not be; check the exclude list in Cargo.toml:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

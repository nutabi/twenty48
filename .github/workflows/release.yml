name: release

# Releases are triggered by merging a version bump into main. Every other merge
# is a no-op: the job stops as soon as it sees the version's tag already exists.
on:
  push:
    branches: [main]

# One release run at a time. Two merges landing together would otherwise both
# check out before either pushes a tag, see the same version untagged, and race
# to publish it — the loser failing at `cargo publish` for no real reason.
# Serialised, the second run finds the tag and stops, which is the no-op it
# should have been.
#
# A run in progress is never cancelled: it may be mid-publish. The cost is that
# a third merge queueing behind an already-pending one makes GitHub drop the
# pending one, so a version bump in that commit is skipped rather than
# released. A run takes seconds and releases here are one bump at a time, so
# that is the cheaper of the two failures.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag, create the release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, so an already-released version can be detected

      - name: Read the version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Is this version already released?
        id: check
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.tag }} exists; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update
        if: steps.check.outputs.release == 'true'

      # Publishing cannot be undone, so the gate runs again here rather than
      # trusting that CI on this same commit has finished.
      - name: Verify
        if: steps.check.outputs.release == 'true'
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          cargo test --locked --doc

      # The irreversible step first: a failure here leaves no tag or release
      # claiming a version that was never published.
      - name: Publish to crates.io
        if: steps.check.outputs.release == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

      - name: Tag the published commit
        if: steps.check.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" \
            -m "twenty48 ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create the GitHub release
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "twenty48 ${{ steps.version.outputs.version }}" \
            --generate-notes \
            --verify-tag
